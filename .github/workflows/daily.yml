name: 건강검진 공지 자동 크롤링

on:
  schedule:
    - cron: '50 22 * * 0-4'  # 매일 22:50 UTC = 07:50 KST (평일만)
  workflow_dispatch: {}

concurrency:
  group: crawl-and-notify
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 의존성 설치
        run: pip install -r requirements.txt

      - name: 이메일 스크린샷용 브라우저 설치
        run: python -m playwright install --with-deps chromium

      - name: 크롤링 + 분석 + 발송 실행
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          EMAIL_SENDER: ${{ secrets.EMAIL_SENDER }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          LAMBDA_RELAY_URL: ${{ secrets.LAMBDA_RELAY_URL }}
          LAMBDA_RELAY_SECRET: ${{ secrets.LAMBDA_RELAY_SECRET }}
        run: python main.py

      - name: 상태 저장 (DB/설정 커밋)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/notices.db data/settings.json data/email_screenshots
          git diff --cached --quiet || git commit -m "자동 크롤링 결과 반영 [skip ci]"
          git pull --rebase origin main
          git push
